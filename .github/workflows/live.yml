name: live
# Calls every cheap HTTPS method once and checks each answer against its result schema in openrpc.json, and compares
# openapi.json with the file carbium.sh serves. A scheduled run that fails opens an issue.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    # Only in this repository; no pull request ever runs this workflow, so a fork never sees the key.
    if: github.repository == 'carbium-sh/spec'
    runs-on: ubuntu-latest
    # Above two passes of 64 calls, each cut off at 20 seconds; a run that keeps being told to wait is cut off here.
    timeout-minutes: 50
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Any non-zero exit fails the run: 1 a mismatch or a method not served, 2 no key, 3 a call still unread after its retry.
      - run: node scripts/live-check.mjs
        shell: bash
        env:
          CARBIUM_KEY: ${{ secrets.CARBIUM_KEY }}
  served:
    # carbium.sh still serves the account API description this repository holds. No key.
    if: github.repository == 'carbium-sh/spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl -fsS --retry 3 https://carbium.sh/openapi.json -o served.openapi.json
          node -e "require('node:assert').deepStrictEqual(...['served.openapi.json', 'openapi.json'].map((f) => JSON.parse(require('node:fs').readFileSync(f, 'utf8'))))" \
            || { echo 'carbium.sh/openapi.json differs from openapi.json: copy it here and run pnpm build'; exit 1; }
  report:
    # A scheduled run that failed opens one issue, or adds to the one already open. No key.
    needs: [live, served]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - run: |
          title='The scheduled live run failed'
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$RUN_URL"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

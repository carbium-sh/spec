name: live
# Calls every cheap HTTPS method once and checks each answer against its result schema in openrpc.json.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    # Only in this repository; no pull request ever runs this workflow, so a fork never sees the key.
    if: github.repository == 'carbium-sh/spec'
    runs-on: ubuntu-latest
    # Above the worst case: two passes of 64 calls, each call cut off at 20 seconds.
    timeout-minutes: 50
    environment: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Any non-zero exit fails the run: 1 a mismatch or a method not served, 2 no key, 3 a call still unread after its retry.
      - run: node scripts/live-check.mjs
        shell: bash
        env:
          CARBIUM_KEY: ${{ secrets.CARBIUM_KEY }}
